global:
  scrape_interval: 15s # How often to check for data

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
      
  # This is the new instruction we are adding!
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']