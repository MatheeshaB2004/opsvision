version: '3.8'
services:
  backend:
    build: ./backend
  frontend:
    build: ./frontend
  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - frontend
      - backend
      
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      
  # Here is our new Node Exporter!
  node-exporter:
    image: prom/node-exporter:latest
    ports:
      - "9100:9100"